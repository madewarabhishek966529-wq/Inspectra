# ==============================================================================
# Inspectra AI — Production & Development Docker Compose Stack
# ==============================================================================
# Usage:
#   docker compose up --build
#   docker compose down
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Target Test Website Fixtures (Intentional Defects for Auditing)
  # ----------------------------------------------------------------------------
  test-fixtures:
    build:
      context: ./test-fixtures
      dockerfile: Dockerfile
    container_name: inspectra-fixtures
    restart: unless-stopped
    ports:
      - "${FIXTURES_PORT:-4000}:4000"
    networks:
      - inspectra-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Isolated Playwright Browser Automation Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: inspectra-worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-5001}:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
    volumes:
      - worker-artifacts:/app/artifacts
    networks:
      - inspectra-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Spring Boot Backend Orchestrator & Scoring Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inspectra-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=docker
      - WORKER_BASE_URL=http://worker:5001
      - INSPECTRA_WORKER_URL=http://worker:5001
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/inspectradb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
      - ARTIFACTS_DIR=/app/artifacts
    volumes:
      - inspectra-db-data:/app/data
      - worker-artifacts:/app/artifacts
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - inspectra-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 8s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 4. React 18 + Vite Frontend Dashboard & Live Execution Cockpit
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inspectra-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - BACKEND_URL=http://backend:8080
      - WORKER_URL=http://worker:5001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - inspectra-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

# ------------------------------------------------------------------------------
# Persistent Volumes (Database & Browser Artifacts survive restarts)
# ------------------------------------------------------------------------------
volumes:
  inspectra-db-data:
    name: inspectra-db-data
  worker-artifacts:
    name: inspectra-worker-artifacts

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  inspectra-net:
    name: inspectra-network
    driver: bridge
