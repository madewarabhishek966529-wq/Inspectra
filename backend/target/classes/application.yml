server:
  port: 8080

spring:
  application:
    name: inspectra-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:h2:file:./data/inspectradb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

inspectra:
  security:
    jwt-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    jwt-expiration-ms: 86400000 # 24 hours
  worker:
    base-url: ${WORKER_BASE_URL:http://localhost:5001}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    timeout-ms: 30000
  storage:
    artifacts-dir: ./artifacts

management:
  endpoints:
    web:
      exposure:
        include: health,info
